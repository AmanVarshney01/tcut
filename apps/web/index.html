    <script>
      // Before first paint: a saved choice, else the OS preference. The header toggle keeps it in sync.
      (() => {
        const saved = localStorage.getItem("tcut-theme");
        const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : system;
      })();
    </script>
