name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/tcut
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm ≥ 11.5 is needed for trusted publishing (OIDC); Node 24 ships it.
      # No registry-url here on purpose: it would write an .npmrc with a placeholder token that npm then
      # sends instead of performing the OIDC exchange (the registry answers 404 on PUT).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Check tag matches package.json version
        run: |
          PKG="v$(bun -e 'console.log(require("./package.json").version)')"
          test "$PKG" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json ${PKG}"; exit 1; }

      - name: Typecheck
        run: bun run typecheck

      - name: Build binaries for all platforms
        run: bun run build:all

      # Idempotent so a failed npm step can be re-run: upload (overwrite) assets if the release already exists.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/tcut-* dist/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "tcut ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/tcut-* dist/SHA256SUMS
          fi

      # Trusted publishing: npm's OIDC trust for AmanVarshney01/tcut → release.yml (configured on npmjs.com).
      # No token anywhere; the job's id-token permission is exchanged for a short-lived publish credential.
      - name: Publish to npm (trusted publishing, with provenance)
        run: |
          npm --version
          npm publish --provenance --access public
