name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/tcut
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm ≥ 11.5 is needed for trusted publishing (OIDC); Node 24 ships it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Check tag matches package.json version
        run: |
          PKG="v$(bun -e 'console.log(require("./package.json").version)')"
          test "$PKG" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json ${PKG}"; exit 1; }

      - name: Typecheck
        run: bun run typecheck

      - name: Build binaries for all platforms
        run: bun run build:all

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "tcut ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/tcut-* dist/SHA256SUMS

      # Trusted publishing: npm's OIDC trust for AmanVarshney01/tcut → release.yml (configured on npmjs.com).
      # No token anywhere; the job's id-token permission is exchanged for a short-lived publish credential.
      - name: Publish to npm (trusted publishing, with provenance)
        run: |
          npm --version
          npm publish --provenance --access public
