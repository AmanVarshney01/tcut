name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Empty unless the NPM_TOKEN repository secret is configured (Settings → Secrets → Actions).
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: packages/tcut
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Check tag matches package.json version
        run: |
          PKG="v$(bun -e 'console.log(require("./package.json").version)')"
          test "$PKG" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json ${PKG}"; exit 1; }

      - name: Typecheck
        run: bun run typecheck

      - name: Build binaries for all platforms
        run: bun run build:all

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "tcut ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/tcut-* dist/SHA256SUMS

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_CONFIG_TOKEN: ${{ env.NPM_TOKEN }}
        run: bun publish --access public
