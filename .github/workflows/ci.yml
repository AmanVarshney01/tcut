name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tcut:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/tcut
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Render demo
        run: bun src/cli.ts examples/demo.ts -o out/demo.mp4 -o out/demo.gif -o out/demo.svg -o out/demo.html

      - name: Build binary
        run: bun run build

      - name: Smoke-test binary from an empty directory
        run: |
          mkdir -p /tmp/empty && cp out/demo.cast /tmp/empty/demo.cast
          cd /tmp/empty && "$GITHUB_WORKSPACE/packages/tcut/dist/tcut" render demo.cast -o demo.svg -o demo.mp4
          ls -la /tmp/empty

      - uses: actions/upload-artifact@v4
        with:
          name: demo-outputs
          path: |
            packages/tcut/out/demo.mp4
            packages/tcut/out/demo.gif
            packages/tcut/out/demo.svg
            packages/tcut/out/demo.html
            packages/tcut/dist/tcut

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/tcut
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Test (renders through Chrome)
        run: bun test
      - name: Build and smoke-test the Linux binary
        run: |
          bun run build
          mkdir -p /tmp/empty && cp out/demo.cast /tmp/empty/ 2>/dev/null || bun src/cli.ts examples/demo.ts --record-only -q --cast /tmp/empty/demo.cast
          cd /tmp/empty && "$GITHUB_WORKSPACE/packages/tcut/dist/tcut" render demo.cast -o demo.svg -o demo.png -o demo.mp4 && ls -la

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: packages/tcut
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress >/dev/null && ffmpeg -version | head -1
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-win-${{ hashFiles('bun.lock') }}
          restore-keys: bun-win-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Environment
        run: |
          bun --version
          bash --version | head -1
          which bash sh ffmpeg chrome google-chrome || true
          ls "/c/Program Files/Google/Chrome/Application/chrome.exe" || true
      # Typecheck runs on macOS and Linux; tsc on the Windows runner costs a minute for the same answer.
      - name: Warm up Chrome (first launch on a fresh runner is slow)
        run: timeout 60 "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless --disable-gpu --no-first-run --dump-dom about:blank >/dev/null 2>&1 || true
      - name: Probe WebView behaviour
        run: TCUT_DEBUG_CHROME=1 bun scripts/probe-webview.ts 2>&1 | grep -v -E "^\[[0-9:/.]+:(INFO|WARNING)" | head -60
      - name: Test
        run: bun test
      - name: Build and smoke-test the Windows binary
        run: |
          bun run build
          bun src/cli.ts examples/demo.ts --record-only -q --cast out/demo.cast
          ./dist/tcut.exe render out/demo.cast -o out/demo.svg -o out/demo.png -o out/demo.mp4 && ls -la out

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web typecheck
      - run: bun run --cwd apps/web build
