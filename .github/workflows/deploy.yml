name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "packages/tcut/docs/llms.txt"
      - "packages/tcut/src/timeline.ts"
      - "packages/tcut/src/markers.ts"
      - "packages/tcut/package.json"
      - "apps/web/**"
      - "packages/infra/**"
      - "packages/config/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Set both as repository secrets to enable CI deploys; otherwise deploy locally with `bun run deploy:prod`.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Deploy with Alchemy (production stage)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: packages/infra
        run: bun alchemy deploy --stage production --yes
      - name: Skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set — deploy skipped."
